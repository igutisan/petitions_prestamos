server:
  port: 8081
spring:
  application:
    name: "Petitions"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080/api/v1/users/"
  sqs:
    region: "us-east-2"
    endpoint: "https://sqs.us-east-2.amazonaws.com"
    sender:
      notification-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/solictudes-estado"
      automatic-validation-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/capacidad-endeudamiento"
    listener:
        response-validation-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/respuesta-solicitudesd"
        max-messages: 10
        wait-time: 20
        concurrency: 5
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
jwt:
  secret: "${JWT_SECRET:bXlzZWNyZXRrZXlmb3Jqd3RzZWNyZXRrZXltdXN0YmVsb25nZW5vdWdoZm9ySFMyNTZhbGdvcml0aG0=}"
adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    database: "petitions"
    schema: "public"
    username: "test"
    password: "P@55w0rd"
springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
  packages-to-scan: "co.com.pragma.api"
info:
  app:
    name: "Auth Service"
    version: "1.0.0"
    description: "API for authentication and authorization"
