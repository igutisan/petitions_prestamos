server:
  port: "${PORT:8085}"
spring:
  application:
    name: "Petitions"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    active: "dev"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  sqs:
    region: "us-east-2"
    sender:
      notification-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/solictudes-estado"
      automatic-validation-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/capacidad-endeudamiento"
      accepted-petitions-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/solicitudes-aprobadas-queue"
    listener:
      response-validation-queue-url: "https://sqs.us-east-2.amazonaws.com/471112759721/respuesta-solicitudesd"
      max-messages: 10
      wait-time: 20
      concurrency: 5

jwt:
  secret: "${JWT_SECRET}"
adapters:
  r2dbc:
    host: "${DB_HOST}"
    port: "${DB_PORT}"
    database: "${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    schema: "public"
    ssl: true
    sslmode: require

info:
  app:
    name: "Auth Service"
    version: "1.0.0"
    description: "API for authentication and authorization"
aws:
  region: "us-east-2"
