version: "3.8"

networks:
  petitions-net:
    driver: bridge

services:
  app-service:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    container_name: petitions-app
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/petitions
      - SPRING_R2DBC_USERNAME=${ADAPTERS_R2DBC_USERNAME}
      - SPRING_R2DBC_PASSWORD=${ADAPTERS_R2DBC_PASSWORD}
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/petitions
      - SPRING_FLYWAY_USER=test
      - SPRING_FLYWAY_PASSWORD=P@55w0rd
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - petitions-net

  postgres:
    image: postgres:16
    container_name: postgres-petitions
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: P@55w0rd
      POSTGRES_DB: petitions
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "listen_addresses=*"]
    networks:
      - petitions-net